{% extends 'layout.html' %}
{% block content %}
    <header class="navbar">
        <div class="logo">
            <a link href="/" class="title">Reciped</a>
        </div>

        <nav>
            <a href="#">Browse</a>
            <a href="#">Upload</a>
            <a href="#">Favourites</a>
            <a href="{{ url_for('login') }}" class="sidelogin-btn">Log in</a>
        </nav>
    </header>

    <div class="hero-container">
        <div class="hero-overlay">
            <h1>Discover your next meal</h1>
            <form action="{{ url_for('home') }}" method="GET" class="search-form">
                <input
                    type="text"
                    name="query"
                    value="{{ query }}"
                    placeholder="Search recipes">
            </form>
        </div>
    </div>

    <hr>

    <div class="recipe-cards">
        <section class="results-title">
            <h2>Results</h2>
        </section>

        <section class="three-card-container">
            {% for recipe in recipes %}
            <div>
                <h3>{{ recipe.title }}</h3>
                <img src="{{ recipe.image }}" width="150" href="{{ url_for('recipe') }}">
            </div>
            {% endfor %}
        </section>
        
    </div>

{% endblock %}
