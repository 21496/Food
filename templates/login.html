{% extends 'layout.html' %}
{% block content %}
    <header class="navbar">
        <div class="logo">
            <a link href="/" class="title">Reciped</a>
        </div>

        <nav>
            <a href="#">Browse</a>
            <a href="#">Upload</a>
            <a href="#">Favourites</a>
            <a href="{{ url_for('login') }}" class="login-btn">Log in</a>
        </nav>
    </header>

    <section class="login-box">
        <h1>Welcome Back</h1>
    </section>

    <form method="POST">
        <p>
            {{ form.username(placeholder="Username") }}
        </p>
        <p>
            {{ form.password(placeholder="Password") }}
        </p>
        <p>
            {{ form.submit() }}
        </p>
    </form>

{% endblock %}
