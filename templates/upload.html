{% extends 'layout.html' %}
{% block content %}
    <header class="navbar">
        <div class="logo">
            <a href="/" class="title">Reciped</a>
        </div>

        <nav>
            <a href="{{ url_for('home') }}">Browse</a>
            {% if current_user.is_authenticated %}
                <a href="{{ url_for('upload') }}">Upload</a>
                <a href="{{ url_for('favourites') }}">Favourites</a>

                <details class="profile-dropdown">
                    <summary class="profile-icon">
                        {{ current_user.username[0]|upper }}
                    </summary>
                    <div class="dropdown-content">
                        <a href="{{ url_for('logout') }}">Log Out</a>
                    </div>
                </details>

            {% else %}
                <a href="{{ url_for('login') }}" class="sidelogin-btn">
                    Log In
                </a>
            {% endif %}
        </nav>
    </header>

    <div class="upload-page">
        <h1>Share a recipe</h1>

        <form method="POST" enctype="multipart/form-data">
            <div class="form-group">
                <label for="recipe_name">Recipe name</label>

                <input type="text" id="recipe_name" name="recipe_name" placeholder="e.g. Grandma's tomato soup" required>
            </div>

            <div class="form-row">
                <div class="form-group">
                    <label for="cuisine">Cuisine</label>

                    <select id="cuisine" name="cuisine" required>
                        <option value="" disabled selected>Select...</option>
                        <option value="Italian">Italian</option>
                        <option value="Mexican">Mexican</option>
                        <option value="Indian">Indian</option>
                        <option value="Chinese">Chinese</option>
                        <option value="Japanese">Japanese</option>
                        <option value="American">American</option>
                        <option value="French">French</option>
                        <option value="Greek">Greek</option>
                        <option value="Other">Other</option>
                    </select>
                </div>

                <div class="form-group">
                    <label for="cook_time">Cook time</label>
                    <input type="text" id="cook_time" name="cook_time" placeholder="e.g. 30 min" required>
                </div>
            </div>

            <div class="form-group">
                <label for="recipe_image">Photo</label>

                <label for="recipe_image" class="upload-box">
                    <span class="upload-icon">📷</span>
                    <span id="upload-text">Click to upload</span>
                </label>
                <input type="file" id="recipe_image" name="recipe_image" accept="image/*" hidden>
            </div>
 
            <div class="form-group">
                <label>Ingredients</label>
                <div id="ingredients">
                    <div class="ingredient-row">
 
                        <input type="text" name="quantity[]" placeholder="Qty">
                        <input type="text" name="ingredient[]" placeholder="Ingredient name">
 
                        <button type="button" class="add-btn" onclick="addIngredient()"> + Add </button>
                    </div>
                </div>
            </div>
 
            <div class="form-group">
 
                <label for="method">Method</label>
                <textarea id="method" name="method" placeholder="Describe your cooking steps..." required></textarea>
            </div>
 
            <button type="submit" class="publish-btn">
                Publish recipe
            </button>
 
        </form>
    </div>

    <div id="toast" class="toast" role="status" aria-live="polite"></div>
    
    <script>
 
    function addIngredient() {
 
        const ingredients = document.getElementById("ingredients");
 
        const row = document.createElement("div");
 
        row.className = "ingredient-row";
 
        row.innerHTML = `
            <input
                type="text"
                name="quantity[]"
                placeholder="Qty"
            >
 
            <input
                type="text"
                name="ingredient[]"
                placeholder="Ingredient name"
            >
 
            <button
                type="button"
                class="remove-btn"
                onclick="removeIngredient(this)"
            >
                Remove
            </button>
        `;
 
        ingredients.appendChild(row);
    }
 
    function removeIngredient(button) {
        button.parentElement.remove();
    }
 
    const imageInput = document.getElementById("recipe_image");
 
    imageInput.addEventListener("change", function () {
        const file = imageInput.files[0];
 
        if (!file) {
            return;
        }
 
        // Show the file name in the upload box and pop up a confirmation
        document.getElementById("upload-text").textContent = file.name;
        showToast("Image added: " + file.name);
    });
 
    function showToast(message) {
        const toast = document.getElementById("toast");
 
        toast.textContent = message;
        toast.classList.add("show");
 
        // Hides the popup again after 3 seconds
        setTimeout(function () {
            toast.classList.remove("show");
        }, 3000);
    }
    </script>
 
{% endblock %}
